<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker · rafal13381</title>
    <link rel="stylesheet" data-consent="fonts" data-href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <script src="js/consent.js?v=20261011f"></script>
    <link rel="stylesheet" href="css/style.css?v=20261015a">
    <script src="js/theme.js?v=20261011f"></script>
</head>
<body>
    <header class="nav wrap">
        <nav class="panel" aria-label="Main">
            <a class="brand" href="index.html">
                <span class="brand-mark" aria-hidden="true">r</span>
                <span>rafal13381</span>
            </a>
            <div class="tabs">
                <a class="tab" href="index.html">Start</a>
                <a class="tab" href="kliker.html" aria-current="page">Kliker</a>
                <a class="tab" href="style.html">Style</a>
            </div>
            <button class="icon-btn" id="themeToggle" type="button" aria-label="Theme"></button>
        </nav>
    </header>

    <main class="wrap game">
        <section class="grid">
            <article class="panel span-8 score-panel materialize">
                <span class="label">Score</span>
                <div><span class="score" id="score" aria-live="polite">0</span></div>
                <div class="score-meta">
                    <span class="stat">Per click <b>×<span id="multiplier">1</span></b></span>
                    <span class="stat" id="autoStat">Auto-clicker <b id="autoState">off</b></span>
                    <span class="stat warn">Tax <b>−<span id="taxAmount">5</span></b> in <b><span id="taxCountdown">10</span>s</b></span>
                </div>

                <div class="click-zone">
                    <button class="click-btn" id="clickButton" type="button" disabled>Click</button>
                </div>

                <div class="hero-actions" style="justify-content:center">
                    <button class="btn btn-primary" id="startButton" type="button">Start Game</button>
                    <button class="btn btn-secondary" id="resetButton" type="button" disabled>Reset</button>
                </div>
            </article>

            <aside class="span-4" style="display:flex;flex-direction:column;gap:16px">
                <article class="panel materialize" style="--i:1">
                    <div class="card-head">
                        <h2>Upgrades</h2>
                    </div>
                    <div class="rows">
                        <button class="upgrade" id="multiplierUpgrade" type="button" disabled>
                            <span class="row-ico" aria-hidden="true">✖️</span>
                            <span class="row-text">
                                <span class="row-title">Multiplier</span>
                                <span class="row-sub">Doubles points per click</span>
                            </span>
                            <span class="price"><span id="multiplierCost">30</span></span>
                        </button>
                        <button class="upgrade" id="autoClickerUpgrade" type="button" disabled>
                            <span class="row-ico" aria-hidden="true">⚙️</span>
                            <span class="row-text">
                                <span class="row-title">Auto-Clicker</span>
                                <span class="row-sub">Clicks once every second</span>
                            </span>
                            <span class="price"><span id="autoClickerCost">50</span></span>
                        </button>
                    </div>
                </article>

                <article class="panel materialize" style="--i:2">
                    <div class="card-head">
                        <h2>Tax</h2>
                        <span class="label">every 10 s</span>
                    </div>
                    <p class="row-sub" style="white-space:normal">If you can’t pay the tax, it’s game over and the score resets.</p>
                    <div class="progress" aria-hidden="true"><span id="taxBar"></span></div>
                </article>
            </aside>
        </section>
    </main>

    <footer class="site-footer wrap">
        <div class="footer-inner">
            <a class="brand" href="index.html">
                <span class="brand-mark" aria-hidden="true">r</span>
                <span>rafal13381</span>
            </a>
            <nav class="footer-links" aria-label="Stopka">
                <a href="index.html">Start</a>
                <a href="kliker.html">Kliker</a>
                <a href="style.html">Style</a>
                <a href="https://github.com/rafal13381">GitHub</a>
                <a href="prywatnosc.html">Prywatność i cookies</a>
                <button class="footer-btn" type="button" data-consent-open>Ustawienia prywatności</button>
            </nav>
            <p class="footer-copy">© 2026 rafal13381 · Programista Full Stack</p>
        </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="js/script2.js?v=20261011f"></script>
</body>
</html>
